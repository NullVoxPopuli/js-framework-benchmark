<!doctype html>
<html>

<head>
  <title>Glimmer v2.0.0 (using GlimmerVM `main`)</title>
  <link rel="stylesheet" href="/css/currentStyle.css">

  <script type="module">
    import {renderComponent} from '@glimmer/core';
    import App from './src/App';

    document.addEventListener(
      'DOMContentLoaded',
      () => {
        const element = document.getElementById('app');
        renderComponent(App, {
          owner: {},
          element: element
        });
      },
      {once: true}
    );
  </script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
